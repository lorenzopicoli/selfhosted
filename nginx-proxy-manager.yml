- name: Setup nginx proxy manager
  hosts:
    - nginx-proxy-manager
  become: true
  vars:
    username: lorenzo
    device_type: normal
    BACKUP_GATEWAY_USERNAME: npm
    BACKUP_GATEWAY_PASSWORD: "{{ BACKUP_GATEWAY_NPM_PASSWORD }}"
  vars_files:
    - env_vars.yml

  tasks:
    - name: Update server and install essential packages
      ansible.builtin.include_tasks: tasks/linux-setup.yml

    - name: Setup linux firewall
      ansible.builtin.include_tasks: tasks/firewall.yml

    - name: Install docker
      ansible.builtin.include_tasks: tasks/docker.yml
    
    - name: Install docker compose
      ansible.builtin.include_tasks: tasks/install-compose.yml
    
    - name: Deploy npm docker apps
      ansible.builtin.include_tasks: "tasks/services/internal/{{ item }}/compose-task.yml"
      loop:
        - backup-agent
        - nginx-proxy-manager
        - dozzle-agent
        # - nginx-proxy-manager
        # - unifi-controller
