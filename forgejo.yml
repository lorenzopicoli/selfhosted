- name: Setup forgejo
  hosts:
    - forgejo
  become: true
  vars:
    username: lorenzo
    device_type: normal
    backup_gateway_username: forgejo
    backup_gateway_password: "{{ backup_gateway_forgejo_password }}"
  vars_files:
    - env_vars.yml

  tasks:
    - name: Update server and install essential packages
      ansible.builtin.include_tasks: tasks/ssh.yml

    - name: Setup linux firewall
      ansible.builtin.include_tasks: tasks/firewall.yml

    - name: Install docker
      ansible.builtin.include_tasks: tasks/docker.yml

    - name: Install docker compose
      ansible.builtin.include_tasks: tasks/install-compose.yml

    - name: Deploy forgejo docker apps
      ansible.builtin.include_tasks: "tasks/services/internal/{{ item }}/compose-task.yml"
      loop:
        - backup-agent
        - forgejo
        - dozzle-agent

    - name: Reclaim image space
      ansible.builtin.include_tasks: tasks/reclaim-docker-image-disk.yml
