- name: Setup dozzle tracker 
  hosts:
    - dozzle
  become: true
  gather_facts: false
  vars:
    username: lorenzo
    device_type: normal
  vars_files:
    - env_vars.yml

  pre_tasks:
    - name: Prepare Linux server for provisioning
      ansible.builtin.include_tasks: tasks/linux-bootstrap.yml

  tasks:
    - name: Update server and install essential packages
      ansible.builtin.include_tasks: tasks/linux-setup.yml

    - name: Install docker
      ansible.builtin.include_tasks: tasks/docker.yml
    
    - name: Install docker compose
      ansible.builtin.include_tasks: tasks/install-compose.yml
    
    - name: Deploy dozzle docker apps
      ansible.builtin.include_tasks: "tasks/services/internal/{{ item }}/compose-task.yml"
      loop:
        - dozzle

  post_tasks:
    - name: Finish initial Linux provisioning
      ansible.builtin.include_tasks: tasks/linux-bootstrap-finalize.yml
