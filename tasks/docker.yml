---
# ====== General ======
- name: Check if Docker is already present.
  command: which docker
  failed_when: false
  changed_when: false
  check_mode: false
  register: docker_command_result
  

# ====== Docker ====== install for normal computers
- name: Install aptitude
  apt:
    name: aptitude
    state: latest
    update_cache: true
  when: "docker_command_result.rc == 1"

- name: Install required system packages
  apt:
    pkg:
      - apt-transport-https
      - ca-certificates
      - curl
      - python3-pip
      - virtualenv
      - python3-setuptools
    state: latest
    update_cache: true
  when: "docker_command_result.rc == 1"

- name: Maintain Docker's APT key and repository
  ansible.builtin.include_tasks: configure-docker-apt-repository.yml
  vars:
    docker_repository_codename: "{{ ansible_facts['distribution_release'] }}"
    docker_repository_force: true

- name: Update apt and install docker-ce
  apt:
    name: docker-ce
    state: latest
    update_cache: true
  when: "docker_command_result.rc == 1"

- name: Install Docker Module for Python
  pip:
    name: docker
    break_system_packages: true
  when: "docker_command_result.rc == 1"



