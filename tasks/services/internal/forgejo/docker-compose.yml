networks:
  forgejo:
    external: false

volumes:
  # forgejo_pg:
  forgejo_data:

services:
  server:
    image: codeberg.org/forgejo/forgejo:9.0.2
    container_name: forgejo
    env_file:
      - /home/lorenzo/configs/.env
    restart: always
    networks:
      - forgejo
    volumes:
      - forgejo_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '3000:3000'
      - '222:22'
    depends_on:
      - db

  db:
    image: postgres:14
    restart: always
    user: '0:0'
    env_file:
      - /home/lorenzo/configs/.db_env
    networks:
      - forgejo
    volumes:
      - /users/lorenzo/home/forgejo_pg:/var/lib/postgresql/data

  backrest:
    image: ghcr.io/garethgeorge/backrest:v1.14.1-alpine
    container_name: backrest
    hostname: forgejo
    restart: unless-stopped
    env_file:
      - /home/lorenzo/configs/backrest/.env
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp
      TZ: America/Toronto
    volumes:
      - /home/lorenzo/configs/backrest/data:/data
      - /home/lorenzo/configs/backrest/config:/config
      - /home/lorenzo/configs/backrest/cache:/cache
      - /home/lorenzo/configs/backrest/tmp:/tmp
      - forgejo_data:/sources/forgejo:ro
      - /var/lib/selfhosted-backup/forgejo:/exports/forgejo:ro
      - /var/lib/selfhosted-restore:/restore
    ports:
      - '9898:9898'
