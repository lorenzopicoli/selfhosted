---
- name: Ensure configs dir exists
  file:
    path: /home/lorenzo/configs
    state: directory

- name: Ensure PostgreSQL 18 data directory exists
  ansible.builtin.file:
    path: /users/lorenzo/home/forgejo_pg18
    state: directory
    owner: '999'
    group: root
    mode: '0700'

- name: Install Forgejo backup tools
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true

- name: Create Forgejo export directory
  ansible.builtin.file:
    path: /var/lib/selfhosted-backup/forgejo
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Copy compose file with owner and permissions
  ansible.builtin.copy:
    src: ./docker-compose.yml
    dest: /home/lorenzo/configs/docker-compose.yml
    owner: lorenzo
    mode: '0644'
  become: true

- name: Copy env var for docker compose
  copy:
    dest: /home/lorenzo/configs/.env
    content: |
       USER_UID=1000
       USER_GID=1000
       FORGEJO__database__DB_TYPE=postgres
       FORGEJO__database__HOST=db:5432
       FORGEJO__database__NAME="{{ FORGEJO_DB_NAME }}"
       FORGEJO__database__USER="{{ FORGEJO_DB_USER }}"
       FORGEJO__database__PASSWD="{{ FORGEJO_DB_PASSWORD }}"

       POSTGRES_DB="{{ FORGEJO_DB_NAME }}"
       POSTGRES_USER="{{ FORGEJO_DB_USER }}"
       POSTGRES_PASSWORD="{{ FORGEJO_DB_PASSWORD }}"

    mode: '0600'

- name: Copy env var for docker compose (db)
  copy:
    dest: /home/lorenzo/configs/.db_env
    content: |
       POSTGRES_DB="{{ FORGEJO_DB_NAME }}"
       POSTGRES_USER="{{ FORGEJO_DB_USER }}"
       POSTGRES_PASSWORD="{{ FORGEJO_DB_PASSWORD }}"

    mode: '0600'


- name: Start forgejo container
  community.docker.docker_compose_v2:
    project_name: forgejo
    build: always
    project_src: '/home/lorenzo/configs'
  register: output

- ansible.builtin.debug:
    var: output

- name: Install Forgejo backup script
  ansible.builtin.copy:
    src: ./backup-forgejo
    dest: /usr/local/sbin/backup-forgejo
    owner: root
    group: root
    mode: '0750'

- name: Install Forgejo backup systemd units
  ansible.builtin.copy:
    src: "./{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - backup-forgejo.service
    - backup-forgejo.timer

- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Enable and start Forgejo backup timer
  ansible.builtin.systemd_service:
    name: backup-forgejo.timer
    enabled: true
    state: started

