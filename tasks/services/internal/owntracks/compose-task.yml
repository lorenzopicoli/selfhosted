---
- name: Ensure configs dir exists
  file:
    path: /home/lorenzo/configs
    state: directory

- name: Install OwnTracks backup tools
  ansible.builtin.apt:
    name:
      - curl
      - tar
    state: present
    update_cache: true

- name: Create OwnTracks backup export directory
  ansible.builtin.file:
    path: /var/lib/selfhosted-backup/owntracks
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Copy compose file with owner and permissions
  ansible.builtin.copy:
    src: ./docker-compose.yml
    dest: /home/lorenzo/configs/docker-compose.yml
    owner: lorenzo
    mode: '0644'
  become: true

- name: Copy env var for docker compose
  copy:
    dest: /home/lorenzo/configs/.env
    content: |

    mode: '0600'

- name: Copy owntracks FE config
  ansible.builtin.copy:
    src: ./owntracks-config.js
    dest: /home/lorenzo/configs/owntracks-config.js
    owner: root
    group: root
    mode: '0644'

- name: Start owntracks container
  community.docker.docker_compose_v2:
    project_name: owntracks
    build: always
    project_src: '/home/lorenzo/configs'
  register: output

- ansible.builtin.debug:
    var: output

- name: Install OwnTracks backup script
  ansible.builtin.copy:
    src: ./backup-owntracks
    dest: /usr/local/sbin/backup-owntracks
    owner: root
    group: root
    mode: '0750'

- name: Install OwnTracks backup systemd units
  ansible.builtin.copy:
    src: "./{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - backup-owntracks.service
    - backup-owntracks.timer

- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Enable and start OwnTracks backup timer
  ansible.builtin.systemd_service:
    name: backup-owntracks.timer
    enabled: true
    state: started

- name: Prune images
  community.docker.docker_prune:
    containers: false
    images: true
    networks: false
    volumes: false
    builder_cache: false

