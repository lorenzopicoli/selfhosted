---
- name: Ensure the Docker Compose plugin is installed
  ansible.builtin.apt:
    name: docker-compose-plugin
    state: present

- name: Create the UniFi OS project directory
  ansible.builtin.file:
    path: /home/lorenzo/configs/unifi-os
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Install the UniFi OS Compose file
  ansible.builtin.copy:
    src: ./docker-compose.yml
    dest: /home/lorenzo/configs/unifi-os/docker-compose.yml
    owner: root
    group: root
    mode: '0644'

- name: Ensure UniFi OS is running
  community.docker.docker_compose_v2:
    project_name: unifi_os
    project_src: /home/lorenzo/configs/unifi-os
    state: present
    wait: true
    wait_timeout: 300
