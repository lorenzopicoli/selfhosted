---
services:
  unifi-os-server:
    image: git.picco.li/lorenzopicoli/unifi-os-docker:5.1.42-6128bc110a36@sha256:6af1e9ac5689dcf101c093f80125895cbe3db8f8253742c190a4cdaa07271829
    container_name: unifi-os-server
    restart: unless-stopped
    cgroup: host
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      UOS_SYSTEM_IP: 192.168.40.23
    extra_hosts:
      - host.docker.internal:host-gateway
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/lib/journal
      - /var/opt/unifi/tmp:size=64m
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - persistent:/persistent
      - data:/data
      - logs:/var/log
      - srv:/srv
      - unifi:/var/lib/unifi
      - mongodb:/var/lib/mongodb
      - postgresql:/var/lib/postgresql
      - rabbitmq-ssl:/etc/rabbitmq/ssl
    ports:
      # UniFi OS web admin port
      - '11443:443'
      # Required for device communication
      - '8080:8080'
      # UniFi STUN port
      - '3478:3478/udp'
      # Required for device discovery
      - '10003:10003/udp'
      # Add hotspot/syslog/speed-test ports only if you use those services.

  backrest:
    image: ghcr.io/garethgeorge/backrest:v1.14.1-alpine
    container_name: backrest
    hostname: unifi
    restart: unless-stopped
    env_file:
      - /home/lorenzo/configs/backrest/.env
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp
      TZ: America/Toronto
    volumes:
      - /home/lorenzo/configs/backrest/data:/data
      - /home/lorenzo/configs/backrest/config:/config
      - /home/lorenzo/configs/backrest/cache:/cache
      - /home/lorenzo/configs/backrest/tmp:/tmp
      - /var/lib/selfhosted-backup/unifi:/exports/unifi:ro
      - /var/lib/selfhosted-restore:/restore
    ports:
      - '9898:9898'

volumes:
  persistent:
  data:
  logs:
  srv:
  unifi:
  mongodb:
  postgresql:
  rabbitmq-ssl:
