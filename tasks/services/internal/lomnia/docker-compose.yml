services:
  backend:
    image: ghcr.io/lorenzopicoli/lomnia-backend:latest
    container_name: lomnia_backend
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    pull_policy: always
    ports:
      - '3010:3010'
    restart: unless-stopped
    # Was having errors with OpenMeteo calls: https://github.com/nodejs/undici/issues/2777
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    env_file:
      - /home/lorenzo/configs/.be_env
  frontend:
    image: ghcr.io/lorenzopicoli/lomnia-frontend:latest
    container_name: lomnia_frontend
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    pull_policy: always
    ports:
      - '80:80'
    restart: unless-stopped
    environment:
      API_URL: https://api.lomnia.picco.li
  ingester:
    image: ghcr.io/lorenzopicoli/lomnia-ingester:latest
    container_name: lomnia_ingester
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    pull_policy: always
    ports:
      - '3030:3030'
    restart: unless-stopped
    env_file:
      - /home/lorenzo/configs/.ingester_env
    volumes:
      - ingester_data:/ingester_data
      - /home/lorenzo/configs/plugins.yaml:/config/plugins.yaml
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: garage
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      - '3900:3900'
      - '3901:3901'
      - '3902:3902'
      - '3903:3903'
    volumes:
      - /home/lorenzo/configs/garage.toml:/etc/garage.toml
      - garage_metadata:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    env_file:
      - /home/lorenzo/configs/.garage_env

    restart: unless-stopped
  garageui:
    image: khairul169/garage-webui:1.1.0
    container_name: garage-webui
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped
    volumes:
      - /home/lorenzo/configs/garage.toml:/etc/garage.toml:ro
    ports:
      - 3909:3909
    env_file:
      - /home/lorenzo/configs/.garage_ui_env

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    hostname: 194276a57385
    stdin_open: true
    tty: true
    container_name: rabbitmq
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      # - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    env_file:
      - /home/lorenzo/configs/.rabbitmq_env
  db:
    image: postgis/postgis:18-3.6
    pull_policy: always
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped
    shm_size: 1gb
    ports:
    - '5432:5432'
    env_file:
      - /home/lorenzo/configs/.db_env
    volumes:
      - local_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lomnia']
      interval: 10s
      timeout: 5s
      retries: 5
  backrest:
    image: ghcr.io/garethgeorge/backrest:v1.14.1-alpine
    container_name: backrest
    hostname: lomnia
    restart: unless-stopped
    env_file:
      - /home/lorenzo/configs/backrest/.env
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp
      TZ: America/Toronto
    volumes:
      - /home/lorenzo/configs/backrest/data:/data
      - /home/lorenzo/configs/backrest/config:/config
      - /home/lorenzo/configs/backrest/cache:/cache
      - /home/lorenzo/configs/backrest/tmp:/tmp
      - /var/lib/selfhosted-backup/lomnia:/exports/lomnia:ro
      - garage_metadata:/sources/lomnia/garage-metadata:ro
      - garage_data:/sources/lomnia/garage-data:ro
      - ingester_data:/sources/lomnia/ingester:ro
      - rabbitmq-data:/sources/lomnia/rabbitmq:ro
      - /var/lib/selfhosted-restore:/restore
    ports:
      - '9898:9898'

volumes:
  garage_metadata:
  garage_data:
  local_pgdata:
  rabbitmq-data:
  ingester_data:
