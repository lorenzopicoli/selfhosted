
---
- name: Check Technitium backup API token
  ansible.builtin.assert:
    that:
      - TECHNITIUM_API_TOKEN | default('') | length > 0
    fail_msg: Add TECHNITIUM_API_TOKEN to env_vars.yml.
  no_log: true

- name: Install Technitium backup tools
  ansible.builtin.apt:
    name:
      - curl
      - python3
    state: present
    update_cache: true

- name: Create Technitium backup export directory
  ansible.builtin.file:
    path: /var/lib/selfhosted-backup/technitium
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Write Technitium backup credentials
  ansible.builtin.copy:
    dest: /etc/selfhosted-backup/technitium.env
    owner: root
    group: root
    mode: '0600'
    content: |
      TECHNITIUM_API_TOKEN={{ TECHNITIUM_API_TOKEN | quote }}
  no_log: true

- name: Ensure configs dir exists
  file:
    path: /home/lorenzo/configs
    state: directory

- name: Copy compose file with owner and permissions
  ansible.builtin.copy:
    src: ./docker-compose.yml
    dest: /home/lorenzo/configs/docker-compose.yml
    owner: lorenzo
    mode: '0644'
  become: true

- name: Copy env var for docker compose
  copy:
    dest: /home/lorenzo/configs/.env
    content: |
      DNS_SERVER_ADMIN_PASSWORD="{{ PIHOLE_WEBPASSWORD }}"

    mode: '0600'

- name: Start dns-server container
  community.docker.docker_compose_v2:
    project_name: dns-server
    build: always
    project_src: '/home/lorenzo/configs'
  register: output

- ansible.builtin.debug:
    var: output

- name: Configure Technitium log rotation
  ansible.builtin.include_tasks: logging-task.yml

- name: Install Technitium backup scripts
  ansible.builtin.copy:
    src: "./{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: '0750'
  loop:
    - backup-technitium
    - export-technitium.py

- name: Install Technitium backup systemd units
  ansible.builtin.copy:
    src: "./{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - backup-technitium.service
    - backup-technitium.timer

- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Enable and start Technitium backup timer
  ansible.builtin.systemd_service:
    name: backup-technitium.timer
    enabled: true
    state: started
