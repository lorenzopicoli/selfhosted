services:
  beanfinance:
    container_name: lofinance
    restart: unless-stopped
    image: git.picco.li/lorenzopicoli/lofinance:main
    ports:
      - '3000:5000'
    environment:
      - BEANCOUNT_FILE=/beans/beans/main.beancount

    env_file:
      - /home/lorenzo/configs/.env
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
