---
- name: Check whether Docker is installed
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_repository_docker_binary

- name: Find existing Docker APT source files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - "*docker*"
    file_type: file
    recurse: false
  register: docker_repository_source_files

- name: Decide whether to manage the Docker repository
  ansible.builtin.set_fact:
    docker_repository_is_needed: >-
      {{
        (docker_repository_force | default(false) | bool)
        or docker_repository_docker_binary.stat.exists
        or (docker_repository_source_files.matched | int > 0)
      }}

- name: Create the Docker APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_repository_is_needed

- name: Refresh Docker's official APT signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    force: true
  when: docker_repository_is_needed

- name: Remove legacy Docker APT source files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/download_docker_com_linux_debian.list
    - /etc/apt/sources.list.d/docker.list
  when: docker_repository_is_needed

- name: Configure Docker's keyring-based APT source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ docker_repository_codename }}
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc
  when: docker_repository_is_needed
