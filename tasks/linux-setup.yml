---
- name: Maintain an existing Docker APT repository before refreshing packages
  ansible.builtin.include_tasks: configure-docker-apt-repository.yml
  vars:
    docker_repository_codename: "{{ ansible_facts['distribution_release'] }}"

- name: Install aptitude
  ansible.builtin.apt:
    name: aptitude
    state: latest
    update_cache: true

- name: Configure SSH access and the server account
  ansible.builtin.include_tasks: ssh.yml

- name: Update apt and install required system packages
  ansible.builtin.apt:
    pkg:
      - curl
      - vim
      - git
    state: latest
    update_cache: true

- name: Install Debian 13 sysctl defaults
  ansible.builtin.apt:
    name: linux-sysctl-defaults
    state: present
  when:
    - ansible_facts['distribution'] == 'Debian'
    - ansible_facts['distribution_major_version'] | int >= 13

- name: Configure Linux log retention
  ansible.builtin.include_tasks: linux-logging.yml

- name: Allow unprivileged ping on Debian 13 and newer
  ansible.posix.sysctl:
    name: net.ipv4.ping_group_range
    value: "0 65535"
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/99-selfhosted-ping.conf
  when:
    - ansible_facts['distribution'] == 'Debian'
    - ansible_facts['distribution_major_version'] | int >= 13
